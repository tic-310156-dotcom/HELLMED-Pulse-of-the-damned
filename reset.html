<!DOCTYPE html>
<!--
  HELLMED · Restablecer contraseña
  Aquí llegan los enlaces de "¿Olvidaste tu contraseña?" que se piden desde
  la web O desde la app móvil (reemplaza la antigua "palabra secreta").
  En Supabase → Authentication → URL Configuration → Redirect URLs agrega:
     https://TU-USUARIO.github.io/HELLMED-Pulse-of-the-damned/reset.html
-->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0708">
  <meta name="robots" content="noindex">
  <title>Restablecer contraseña · HELLMED</title>
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extras.css">
  <script>
    try { var t = localStorage.getItem('hellmed-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
  <script src="supabase-client.js" defer></script>
</head>
<body class="page-reset">
  <main class="reset">
    <div class="reset__box">
      <a href="index.html" class="navbar__logo" aria-label="Volver al inicio">
        <img src="icons/LOGO_HELLMED.jpeg" alt="HELLMED" style="height:52px;width:auto;display:block;margin:0 auto 1rem">
      </a>
      <h1 class="modal__title">Nueva contraseña</h1>
      <p class="modal__note" id="resetStatus">Comprobando el enlace…</p>

      <form class="auth-form" id="resetForm" novalidate hidden>
        <div class="field">
          <label class="field__label" for="newPass">Nueva contraseña</label>
          <input class="field__input" type="password" id="newPass" autocomplete="new-password" placeholder="Mínimo 8 caracteres, letras y números">
        </div>
        <div class="field">
          <label class="field__label" for="newPass2">Confirmar contraseña</label>
          <input class="field__input" type="password" id="newPass2" autocomplete="new-password" placeholder="Repite tu contraseña">
          <p class="field__error" id="resetError"></p>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Guardar contraseña</button>
      </form>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const db = window.HELLMED && window.HELLMED.db;
      const status = document.getElementById('resetStatus');
      const form = document.getElementById('resetForm');
      const err = document.getElementById('resetError');

      if (!db) { status.textContent = 'Necesitas conexión a internet para cambiar tu contraseña.'; return; }

      // Si el enlace venía con error (caducado o ya usado), Supabase lo pone en el hash
      if (/error_description=/.test(location.hash)) {
        status.textContent = 'El enlace caducó o ya se usó. Pide uno nuevo desde "¿Olvidaste tu contraseña?".';
        return;
      }

      let listo = false;
      const mostrarFormulario = () => {
        if (listo) return; listo = true;
        status.textContent = 'Escribe tu nueva contraseña. Servirá en la web y en la app HellMed Hub.';
        form.hidden = false;
        document.getElementById('newPass').focus();
      };

      db.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (event === 'INITIAL_SESSION' && session)) mostrarFormulario();
      });
      // Por si el evento ya ocurrió antes de suscribirnos
      db.auth.getSession().then(({ data }) => { if (data.session) mostrarFormulario(); });
      setTimeout(() => { if (!listo) status.textContent = 'Abre esta página desde el enlace que te llegó por correo.'; }, 4000);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('newPass').value;
        const p2 = document.getElementById('newPass2').value;
        if (p1.length < 8 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) { err.textContent = 'Mínimo 8 caracteres, combinando letras y números.'; return; }
        if (p1 !== p2) { err.textContent = 'Las contraseñas no coinciden.'; return; }
        err.textContent = '';
        const btn = form.querySelector('button');
        btn.disabled = true; btn.textContent = 'Guardando…';
        const { error } = await db.auth.updateUser({ password: p1 });
        btn.disabled = false; btn.textContent = 'Guardar contraseña';
        if (error) { err.textContent = 'No se pudo guardar. Intenta de nuevo o pide otro enlace.'; return; }
        form.hidden = true;
        status.innerHTML = '¡Listo! Tu contraseña se actualizó. Ya puedes <a href="index.html">volver al sitio</a> o entrar desde la app.';
      });
    });
  </script>
</body>
</html>
