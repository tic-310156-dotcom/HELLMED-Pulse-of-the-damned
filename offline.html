<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0708">
  <title>Sin conexión | HELLMED</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0708;color:#f3ebe7;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    main{max-width:460px}
    .pulse{width:100%;max-width:320px;height:60px;margin:0 auto 18px}
    .pulse polyline{fill:none;stroke:#d3202a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    h1{font-family:Georgia,serif;letter-spacing:.08em;font-size:1.7rem;margin:0 0 6px}
    h1 span{color:#d3202a}
    p{color:#a89894;line-height:1.6;margin:10px 0}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
    a,button{font:600 .95rem system-ui,sans-serif;padding:12px 22px;border-radius:4px;border:2px solid #d3202a;cursor:pointer;text-decoration:none}
    button{background:#d3202a;color:#fff} a{background:transparent;color:#f3ebe7}
    a:hover,button:hover{filter:brightness(1.15)}
  </style>
</head>
<body>
  <main>
    <svg class="pulse" viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="0,30 180,30 205,30 220,8 240,52 258,18 272,30 600,30"/>
    </svg>
    <h1>HELL<span>MED</span></h1>
    <p><strong>Sin conexión a internet.</strong></p>
    <p>Esta página no está guardada en tu dispositivo todavía. Lo que ya visitaste sigue disponible sin internet; el inicio de sesión necesita conexión.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="index.html">Ir al inicio</a>
    </div>
  </main>
</body>
</html>
